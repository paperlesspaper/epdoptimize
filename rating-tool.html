<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPDOptimize Rating Tool</title>
    <style>:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;--ink:#1d2329;--muted:#64707d;--line:#d8dee5;--panel:#f6f8fa;--paper:#fff;--accent:#176f6b;--accent-strong:#0d5b57;--focus:#f4c542}*{box-sizing:border-box}body{background:var(--paper);min-height:100vh;color:var(--ink);margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header{border-bottom:1px solid var(--line);justify-content:space-between;align-items:center;gap:1rem;padding:1rem clamp(1rem,3vw,2rem);display:flex}h1,h2,p{margin:0}h1{letter-spacing:0;font-size:1.25rem}h2{font-size:1rem}a{color:var(--accent-strong)}main{grid-template-columns:minmax(18rem,24rem) minmax(0,1fr);min-height:calc(100vh - 4rem);display:grid}aside{border-right:1px solid var(--line);background:var(--panel);align-content:start;gap:1rem;padding:1rem;display:grid}fieldset{border:0;border-bottom:1px solid var(--line);gap:.75rem;margin:0;padding:0 0 1rem;display:grid}fieldset:last-child{border-bottom:0}legend{color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:0 0 .75rem;font-size:.82rem;font-weight:750}label{color:var(--muted);gap:.35rem;font-size:.82rem;font-weight:650;display:grid}select{border:1px solid var(--line);background:var(--paper);width:100%;min-height:2.35rem;color:var(--ink);font:inherit;border-radius:6px}input[type=file]::file-selector-button{border:1px solid var(--line);background:var(--paper);width:100%;min-height:2.35rem;color:var(--ink);font:inherit;border-radius:6px}select{padding:.45rem .55rem}input[type=file]{width:100%;min-width:0}input[type=file]::file-selector-button{background:var(--accent);color:#fff;cursor:pointer;border-color:#0000;width:auto;margin-right:.75rem;padding:0 .75rem}button,.button{border:1px solid var(--accent);background:var(--accent);color:#fff;min-height:2.25rem;font:inherit;cursor:pointer;border-radius:6px;justify-content:center;align-items:center;padding:.4rem .75rem;font-size:.9rem;font-weight:750;text-decoration:none;display:inline-flex}button.secondary{border-color:var(--line);background:var(--paper);color:var(--ink)}button:disabled{cursor:not-allowed;opacity:.58}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.controls-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;display:grid}.controls-grid .full{grid-column:1/-1}.actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;display:grid}.status{color:var(--muted);font-size:.85rem;line-height:1.4}.workspace{grid-template-rows:auto minmax(0,1fr) auto;gap:1rem;min-width:0;padding:1rem;display:grid}.meta-bar{flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem;display:flex}.pair-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;min-height:0;display:grid}.candidate{border:1px solid var(--line);background:var(--paper);border-radius:8px;grid-template-rows:auto minmax(0,1fr);gap:.75rem;min-width:0;padding:.75rem;display:grid}.candidate-head{color:var(--muted);justify-content:space-between;gap:.75rem;font-size:.9rem;display:flex}.canvas-frame{border:1px solid var(--line);background-color:#0000;background-image:linear-gradient(45deg,#eff2f5 25%,#0000 25%),linear-gradient(-45deg,#eff2f5 25%,#0000 25%),linear-gradient(45deg,#0000 75%,#eff2f5 75%),linear-gradient(-45deg,#0000 75%,#eff2f5 75%);background-position:0 0,0 8px,8px -8px,-8px 0;background-repeat:repeat,repeat,repeat,repeat;background-size:16px 16px;background-attachment:scroll,scroll,scroll,scroll;background-origin:padding-box,padding-box,padding-box,padding-box;background-clip:border-box,border-box,border-box,border-box;border-radius:6px;place-items:center;min-height:18rem;display:grid;overflow:auto}canvas{object-fit:contain;max-width:100%;max-height:68vh;display:block}.vote-row{grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;display:grid}.vote-row button{min-height:3rem}.small-actions{justify-content:center;gap:.5rem;display:flex}.details{color:var(--muted);font-size:.8rem;line-height:1.35}[hidden]{display:none!important}@media (width<=980px){main,.pair-grid{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}@media (width<=620px){header,.meta-bar{flex-direction:column;align-items:flex-start}.controls-grid,.actions,.vote-row{grid-template-columns:1fr}}</style>
    <script type="module" crossorigin src="/epdoptimize/assets/ratingTool-DWaPeJSa.js"></script>
    <link rel="modulepreload" crossorigin href="/epdoptimize/assets/src-BjyfroxI.js">
    <link rel="modulepreload" crossorigin href="/epdoptimize/assets/constants-DGcipeka.js">
  </head>
  <body>
    <header>
      <h1>EPDOptimize Rating Tool</h1>
      <nav aria-label="Project links">
        <a href="./index.html">Demo</a>
      </nav>
    </header>

    <main>
      <aside>
        <fieldset>
          <legend>Dataset</legend>
          <label>
            Comparison
            <select id="comparisonModeSelect">
              <option value="legacyLayered" selected>
                Previous Auto vs layered Auto
              </option>
              <option value="autoBaseline">
                Current Auto vs baseline Auto
              </option>
              <option value="autoToneContrast">
                Auto S-curve vs Auto contrast
              </option>
              <option value="autoWhiteGuard">
                Auto white guard vs unguarded Auto
              </option>
              <option value="chromaRgb">
                Experimental chroma vs RGB matching
              </option>
              <option value="hueMixRgb">
                Hue mix gradient vs RGB diffusion
              </option>
              <option value="magentaRgb">
                Magenta probe vs RGB diffusion
              </option>
              <option value="all">All variants</option>
            </select>
          </label>
          <label>
            Sample mode
            <select id="sampleModeSelect">
              <option value="all">All samples</option>
              <option value="selected">Selected sample</option>
            </select>
          </label>
          <label>
            Sample
            <select id="sampleSelect"></select>
          </label>
          <label>
            Upload image
            <input type="file" id="fileInput" accept="image/*" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Display</legend>
          <div class="controls-grid">
            <label class="full">
              Palette
              <select id="paletteSelect">
                <option value="aitjcize-spectra6" selected>
                  aitjcize Spectra 6
                </option>
                <option value="default">Default</option>
                <option value="generic-2-color-eink">
                  2 Color eInk (generic)
                </option>
                <option value="generic-4-grayscale">
                  4 Grayscale (generic)
                </option>
                <option value="trmnl-seeed-16-grayscale">
                  16 Grayscale (TRMNL / Seeed Studio)
                </option>
                <option value="spectra6">Spectra 6</option>
                <option value="spectra6-boeber">Spectra 6 Böber</option>
                <option value="spectra6-original">
                  Spectra 6 Original (no replace)
                </option>
                <option value="spectra6-original-preview">
                  Spectra 6 Original + preview
                </option>
                <option value="spectra6legacy">Spectra 6 Legacy</option>
                <option value="acep">Gallery</option>
                <option value="gameboy">Game Boy</option>
              </select>
            </label>
            <label>
              Screen
              <select id="screenSelect">
                <option value="spectra6_1_54">
                  1.54 Inch Spectra 6 - 240 x 240
                </option>
                <option value="spectra6_1_69">
                  1.69 Inch Round Spectra 6 - 400 x 400
                </option>
                <option value="spectra6_3_7">
                  3.7 Inch Spectra 6 - 720 x 480
                </option>
                <option value="spectra6_4">
                  4 Inch Spectra 6 - 600 x 400
                </option>
                <option value="spectra6_5_9">
                  5.9 Inch Spectra 6 - 960 x 680
                </option>
                <option value="spectra6_7_09">
                  7.09 Inch Spectra 6 - 1600 x 1200
                </option>
                <option value="openpaper7" selected>
                  7.3 Inch Spectra 6 / OpenPaper 7 - 800 x 480
                </option>
                <option value="spectra6_8_14">
                  8.14 Inch Spectra 6 - 1024 x 576
                </option>
                <option value="spectra6_10">
                  10 Inch Spectra 6 - 1600 x 1200
                </option>
                <option value="openpaperL">
                  13.3 Inch Spectra 6 / OpenPaper L - 1600 x 1200
                </option>
                <option value="spectra6_25_3">
                  25.3 Inch Spectra 6 - 3200 x 1800
                </option>
                <option value="spectra6_28_5">
                  28.5 Inch Spectra 6 - 3060 x 2160
                </option>
                <option value="spectra6_31_5">
                  31.5 Inch Spectra 6 - 2560 x 1440
                </option>
              </select>
            </label>
            <label>
              Fit
              <select id="fitSelect">
                <option value="contain">Contain</option>
                <option value="cover">Cover</option>
              </select>
            </label>
            <label class="full">
              Orientation
              <select id="orientationSelect">
                <option value="landscape">Landscape</option>
                <option value="portrait">Portrait</option>
                <option value="original">Original</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Votes</legend>
          <p id="statusLine" class="status">Preparing comparison...</p>
          <div class="actions">
            <button id="exportButton" type="button">Export JSON</button>
            <button id="clearButton" class="secondary" type="button">
              Clear
            </button>
          </div>
        </fieldset>
      </aside>

      <section class="workspace" aria-label="Pairwise comparison">
        <div class="meta-bar">
          <div>
            <h2 id="imageTitle">Loading</h2>
            <p id="pairSummary" class="details">Generating variants...</p>
          </div>
          <button id="nextButton" class="secondary" type="button">Skip</button>
        </div>

        <div class="pair-grid">
          <article class="candidate">
            <div class="candidate-head">
              <strong>A</strong>
              <span id="leftDetails" class="details"></span>
            </div>
            <div class="canvas-frame">
              <canvas id="leftCanvas"></canvas>
            </div>
          </article>

          <article class="candidate">
            <div class="candidate-head">
              <strong>B</strong>
              <span id="rightDetails" class="details"></span>
            </div>
            <div class="canvas-frame">
              <canvas id="rightCanvas"></canvas>
            </div>
          </article>
        </div>

        <div class="vote-row">
          <button id="leftButton" type="button">A is better</button>
          <div class="small-actions">
            <button id="tieButton" class="secondary" type="button">Tie</button>
          </div>
          <button id="rightButton" type="button">B is better</button>
        </div>
      </section>
    </main>
  </body>
</html>
